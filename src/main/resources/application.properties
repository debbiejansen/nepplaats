spring.application.name=nepplaats
# De URL naar je lokale PostgreSQL database (vervang 'naam_van_je_database' met je echte databasenaam)
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres

# Je PostgreSQL gebruikersnaam (standaard is dit vaak 'postgres')
spring.datasource.username=postgres

# Het bijbehorende wachtwoord
spring.datasource.password=postgres

# Zorgt ervoor dat Hibernate automatisch de tabellen aanmaakt of updatet op basis van je Java code
spring.jpa.hibernate.ddl-auto=update

# Laat de SQL-queries die Spring Boot op de achtergrond uitvoert zien in je terminal (super handig voor testen!)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true